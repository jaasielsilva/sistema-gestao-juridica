# Servidor HTTPS. Certificados esperados em /etc/nginx/certs (fullchain.pem e privkey.pem).
# Em producao troque pelo certificado real (Let's Encrypt, load balancer da nuvem etc.).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

# Todo trafego HTTP e redirecionado para HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: o navegador passa a exigir HTTPS neste dominio por 2 anos.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/locations.conf;
}
