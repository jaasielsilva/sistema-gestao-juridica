# Locations compartilhados pelos servers HTTP e HTTPS.

# A API fica atras do mesmo dominio: sem CORS e o navegador nunca fala direto com o backend.
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # Este nginx e a borda: sobrescreve o X-Forwarded-For (nao confia no que o cliente enviou).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O nginx ja envia estes cabecalhos: evita duplicar os do backend.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
}

# Camada extra contra forca bruta: limite por IP nos endpoints de autenticacao (alem do bloqueio no backend).
location /api/v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O nginx ja envia estes cabecalhos: evita duplicar os do backend.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
}

# Arquivos com hash no nome podem ser cacheados para sempre; o index.html nunca.
location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
