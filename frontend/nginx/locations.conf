# Locations compartilhados pelos servers HTTP e HTTPS.

# Limite geral para toda a API: protege endpoints de negocio contra abuso de recursos (SEC-007).
# burst=60 permite rajadas curtas (ex: carregamento inicial de pagina); nodelay evita filas longas.
location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # Este nginx e a borda: sobrescreve o X-Forwarded-For (nao confia no que o cliente enviou).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O nginx ja envia estes cabecalhos: evita duplicar os do backend.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
}

# Limite mais restrito para endpoints de autenticacao: camada extra alem do bloqueio no backend.
# Sobrescreve o location /api/ acima para este path especifico (nginx usa o prefixo mais longo).
location /api/v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O nginx ja envia estes cabecalhos: evita duplicar os do backend.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
}

# Arquivos com hash no nome podem ser cacheados para sempre; o index.html nunca.
location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    try_files $uri =404;
}

location / {
    expires -1;
    sub_filter '<app-root>' '<app-root ngCspNonce="$request_id">';
    sub_filter_once on;
    try_files $uri $uri/ /index.html;
}
