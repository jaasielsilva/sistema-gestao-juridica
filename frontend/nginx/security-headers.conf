# Cabecalhos de seguranca compartilhados pelos servers HTTP e HTTPS.
# Atencao: add_header dentro de um "location" APAGA os desta lista (heranca do nginx). Por isso os locations
# usam "expires" e nao add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: so o proprio site + as fontes do Google usadas pelo Material. Sem 'unsafe-inline' em scripts.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
