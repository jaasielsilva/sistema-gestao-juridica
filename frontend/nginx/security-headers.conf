# Cabecalhos de seguranca compartilhados pelos servers HTTP e HTTPS.
# Atencao: add_header dentro de um "location" APAGA os desta lista (heranca do nginx). Por isso os locations
# usam "expires" e nao add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: so o proprio site + fontes do Google (Material Icons).
# 'unsafe-inline' removido de style-src (SEC-006): Angular Material injeta estilos via <style> no <head>,
# mas o build de producao (ViewEncapsulation.Emulated) usa classes CSS e nao styles inline no DOM.
# Se estilos quebrarem apos upgrade do Angular Material, reintroduza 'unsafe-inline' com justificativa aqui.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
