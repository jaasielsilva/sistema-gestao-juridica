<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="shell__sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [attr.aria-label]="'Menu principal'"
  >
    <app-sidebar (navigated)="isMobile() && drawer.close()" />
  </mat-sidenav>

  <mat-sidenav-content class="shell__main">
    <app-header (menuToggle)="drawer.toggle()" />

    <div class="shell__scroll">
      <main class="shell__content" id="conteudo">
        <app-breadcrumb />
        <router-outlet />
      </main>
    </div>

    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
