<main class="login">
  <mat-card class="login__card" appearance="outlined">
    <mat-card-header>
      <mat-card-title class="login__title">{{ appName }}</mat-card-title>
      <mat-card-subtitle>Entre com sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" autofocus />
          @if (form.controls.email.hasError('required')) {
            <mat-error>Informe o e-mail</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>E-mail inválido</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="senha"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'"
            (click)="hidePassword.set(!hidePassword())"
          >
            <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error>Informe a senha</mat-error>
        </mat-form-field>

        @if (error(); as message) {
          <p class="login__error" role="alert">{{ message }}</p>
        }

        <button mat-flat-button type="submit" class="login__submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Entrar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
