<app-auth-page subtitle="Recuperar senha">
  @if (done(); as message) {
    <div class="form-stack">
      <p class="form-success" role="status">{{ message }}</p>
      <a mat-flat-button routerLink="/login" class="form-submit">Voltar ao login</a>
    </div>
  } @else {
    <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" ngNativeValidate>
      <p class="hint">Informe o e-mail da sua conta. Se ela existir, enviaremos um link para criar uma nova senha.</p>
      <div class="auth-field">
        <label class="auth-label" for="email">E-mail</label>
        <input class="auth-input" required id="email" type="email" formControlName="email" autocomplete="username" autofocus />
      </div>

      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }

      <button mat-flat-button type="submit" class="form-submit" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Enviar link
        }
      </button>
      <div class="form-links">
        <a routerLink="/login">Voltar ao login</a>
      </div>
    </form>
  }
</app-auth-page>
