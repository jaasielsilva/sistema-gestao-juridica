# Sobreposicao para servir o frontend em HTTPS (teste local com certificado autoassinado ou producao com certificado real).
#   bash infrastructure/https/gen-dev-cert.sh
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
# Acesse https://localhost:8443 (o navegador avisara sobre o certificado autoassinado: so no teste local).
# O redirecionamento HTTP->HTTPS assume a porta padrao 443 (producao); localmente acesse direto a 8443.
services:
  backend:
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost:8443}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:8443}
      COOKIE_SECURE: "true" # cookie de refresh so viaja por HTTPS

  frontend:
    ports: !override
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8081:80" # so redireciona para HTTPS
    volumes:
      - ./frontend/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/https/certs:/etc/nginx/certs:ro
