name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Roda toda segunda mesmo sem commits: novas vulnerabilidades (CVEs) aparecem a qualquer momento.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # O runner do GitHub tem Docker: os testes de integracao (Testcontainers + SQL Server) rodam de verdade.
      - name: Build e testes
        run: mvn -B verify
      # Varre o JAR final (todas as bibliotecas, inclusive as transitivas gerenciadas pelo Spring Boot).
      # O pom.xml sozinho nao basta: as versoes vem do BOM do Boot.
      - name: Preparar JAR para varredura
        run: mkdir -p ../scan-jar && cp target/app.jar ../scan-jar/
      # Trivy pelo contêiner oficial, na mesma versão validada localmente (determinístico; sem depender de instalador).
      - name: Vulnerabilidades no JAR (Trivy)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scan-jar:/jar:ro" \
            -v "${{ github.workspace }}/.trivyignore.yaml:/ignore.yaml:ro" \
            aquasec/trivy:0.58.0 rootfs --no-progress --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile /ignore.yaml --exit-code 1 /jar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vulnerabilidades em dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Testes
        run: npx ng test --watch=false
      - name: Build de producao
        run: npx ng build --configuration production

  database-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scripts numerados e sem GO
        run: |
          bad=$(ls database/scripts | grep -vE '^[0-9]{3}_[a-z0-9_]+\.sql$' || true)
          [ -z "$bad" ] || { echo "Nome fora do padrao NNN_descricao.sql:"; echo "$bad"; exit 1; }
          ! grep -liE '^\s*GO\s*$' database/scripts/*.sql || { echo "Scripts nao devem conter GO"; exit 1; }
      - name: Numeracao sem buracos nem duplicatas
        run: |
          ls database/scripts | cut -c1-3 | sort | uniq -d | grep . && { echo "Numero de script duplicado"; exit 1; } || true
          n=0; for f in $(ls database/scripts | cut -c1-3 | sort); do
            [ "$((10#$f))" -eq "$n" ] || { echo "Falta o script numero $n (encontrado $f)"; exit 1; }; n=$((n+1)); done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build das imagens
        run: |
          docker build -t app-backend ./backend
          docker build -t app-frontend ./frontend
      - name: Vulnerabilidades nas imagens (Trivy)
        run: |
          for img in app-backend app-frontend; do
            echo "=== $img ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}/.trivyignore.yaml:/ignore.yaml:ro" \
              aquasec/trivy:0.58.0 image --no-progress --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --ignorefile /ignore.yaml --exit-code 1 "$img"
          done
