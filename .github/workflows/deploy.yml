name: Deploy

# Produção: roda sozinho quando o CI passa na main (ou seja, depois que um PR é mesclado).
# Também pode ser disparado à mão (Actions > Deploy > Run workflow), por exemplo para reaplicar um commit anterior da main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit da main para publicar (vazio = último commit da main)"
        required: false

permissions:
  contents: read

# Um deploy por vez; o seguinte espera em vez de cancelar o que está rodando.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na VPS
    # O CI da main precisa ter passado em um push (a execução semanal agendada não publica nada).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://erpcorporativo.cloud
    steps:
      - name: Definir commit
        id: alvo
        env:
          SHA_WORKFLOW_RUN: ${{ github.event.workflow_run.head_sha }}
          SHA_INPUT: ${{ inputs.sha }}
          SHA_ATUAL: ${{ github.sha }}
        run: |
          sha="${SHA_WORKFLOW_RUN:-${SHA_INPUT:-$SHA_ATUAL}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalido: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Publicando $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # A chave só executa scripts/deploy-vps.sh na VPS (command= no authorized_keys); o SHA vai como argumento.
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SHA: ${{ steps.alvo.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" "$SHA"

      - name: Verificar no ar
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://erpcorporativo.cloud/api/v1/auth/config || true)
            [ "$code" = "200" ] && { echo "Producao respondeu 200."; exit 0; }
            sleep 6
          done
          echo "Producao nao respondeu 200 (ultimo codigo: $code)"; exit 1
